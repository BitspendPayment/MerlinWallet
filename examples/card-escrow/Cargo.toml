[package]
name = "card-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "A worked example: a card programme's settlement service reimbursed from a Bitcoin escrow."

[[bin]]
name = "mock-provider"
path = "src/bin/mock_provider.rs"

[[bin]]
name = "card-service"
path = "src/bin/card_service.rs"

[dependencies]
# The escrow itself: the policy vocabulary, the evidence types and the release shapes are the
# cosigner's, imported rather than restated. An example that defined its own copy of the wire would
# prove that the copy works.
cosigner = { path = "../../cosigner" }
ark = { path = "../../crates/ark", features = ["signing", "client"] }
threshold = { path = "../../crates/threshold", features = ["std"] }
# The settlement service itself: its share, its claims, and turning an approval into a payment.
escrow-service = { path = "../../crates/escrow-service" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# The tests drive the wire with no enclave behind it, so they believe every request. Test builds
# only: the binaries are built without it and check every request's attestation.
escrow-service = { path = "../../crates/escrow-service", features = ["test-trust"] }
# Reading a held SSE stream in a test, the way the runtime reads one.
futures-util = "0.3"
