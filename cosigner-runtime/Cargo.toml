[package]
name = "cosigner-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cosigner-runtime"
path = "src/main.rs"

[features]
default = []

[dependencies]
# Sandboxes the untrusted contract WASM (component-model, no WASI). The cosigner itself is native.
wasmtime = { version = "45", features = ["component-model"] }
# Composes a template + a synthesized config provider into one contract component. Pinned to 0.248
# to match wasmtime 45's transitive wasm-encoder/wasmparser (no version-resolution conflict).
wasm-compose = "=0.248.0"
# Temp files for the (filesystem-based) wasm-compose API.
tempfile = "3"
http = "1"
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
    "metrics",
    "logs",
] }
tracing-opentelemetry = "0.28"
opentelemetry-appender-tracing = "0.27"
opentelemetry-semantic-conventions = "0.27"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Persistence — single embedded SQLite KV backend. `bundled` compiles SQLite from source so the
# build needs no system libsqlite3 (matters for the Nix/enclave build and for CI images).
rusqlite = { version = "0.32", features = ["bundled"] }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }

# Ark protocol
ark = { path = "../crates/ark", features = ["client"] }
reqwest = { version = "0.12", features = ["json"] }

# FCM HTTP v1 OAuth (service-account JWT bearer flow)
jsonwebtoken = "9"

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }
# Streaming ceremony sessions: lets the handler own a ceremony across rounds as ordinary
# local state, which is the whole point of moving off the unary API.
async-stream = "0.3"

# Electrum (raw TCP)
tokio-util = { version = "0.7", features = ["codec"] }

# Crypto
sha2 = "0.10"
# Session-token signing: the cosigner's own Ed25519 keypair (32-byte seed from env).
ed25519-dalek = "2"
# Zeroize secret key material on drop (multi-tenant: keys share one address space natively).
zeroize = "1"
threshold = { path = "../crates/threshold", features = ["std"] }
parking_lot = "0.12"
k256 = { version = "0.13", features = ["arithmetic"] }
# FutureExt::catch_unwind for actor panic recovery
futures = "0.3"

# HTTP/REST
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# WebAuthn ceremony server (register/assert). Standard passkey flow — ceremony state kept in-memory
# (a DashMap), so the `danger-allow-state-serialisation` feature is NOT enabled; only the resulting
# `Passkey` credential is persisted (serde-serializable by default).
webauthn-rs = "0.5.5"
# Wire types (ResidentKeyRequirement) not re-exported by the webauthn-rs prelude.
webauthn-rs-proto = "0.5.5"
# UUIDv5 for the deterministic per-user WebAuthn handle (same `Uuid` type webauthn-rs re-exports).
uuid = { version = "1", features = ["v5"] }

# Misc
rand = "0.8"
base64 = "0.22"
dashmap = "6"
anyhow = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
hex = "0.4"
tonic = "0.12"
# Headless soft authenticator to drive the passkey create/get in the webauthn flow test (no device).
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[build-dependencies]
tonic-build = "0.12"
