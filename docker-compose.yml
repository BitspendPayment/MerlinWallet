name: mpctest

version: '3'
services:
  bitcoind:
    image: ghcr.io/getumbrel/docker-bitcoind:v29.0  # or another recent tag, includes bitcoin-cli
    container_name: mpc_bitcoind
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - 18443:18443
      - 18444:18444
      # ZMQ
      - 28332:28332
      - 28333:28333
    volumes:
      - bitcoin_data:/data/.bitcoin
    command:
      - -regtest=1 # ⬅️ This is the key argument
      - -server=1
      - -printtoconsole
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=admin1     # ⬅️ ADD THIS
      - -rpcpassword=123    # ⬅️ ADD THIS
      - -rpcport=18443 # ⬅️ Correct RegTest RPC port
      - -port=18444 # ⬅️ Correct RegTest P2P port
      - -txindex=1
      - -fallbackfee=0.00001
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -datadir=/data/.bitcoin


  electrs:
    # Pinned by digest: the one image in this stack that floated, and CI now boots the stack.
    image: ghcr.io/vulpemventures/electrs@sha256:999a2218f423c0fb167ee53b282aa7929a9d4abba38ef16f67f407acd00589d4
    container_name: mpc_electrs
    ports:
      - "50001:50001" # TCP
      - "50002:50002" # SSL
      - "4224:4224"   # HTTP monitoring
      - "30000:30000" # Esplora REST (used by ark-client-sample / Bob)
    depends_on:
      - bitcoind
    entrypoint:
      - /build/electrs
    command:
      - -vvvv
      - --network
      - regtest
      - --daemon-dir
      - /data/.bitcoin
      - --daemon-rpc-addr
      - mpc_bitcoind:18443
      - --cookie
      - admin1:123
      - --http-addr
      - 0.0.0.0:30000
      - --electrum-rpc-addr
      - 0.0.0.0:50001
      - --cors
      - "*"
      - --jsonrpc-import
    volumes:
      - bitcoin_data:/data/.bitcoin:ro
    restart: unless-stopped

volumes:
  bitcoin_data:


networks:
  default:
    name: mpctest