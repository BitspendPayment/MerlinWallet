[package]
name = "enclave-client"
version = "0.1.0"
edition = "2021"
description = "Verifies enclave-runtime's attestation documents: the Nitro chain, PCR0 and PCR16, and the binding to the TLS certificate a connection served. Pure Rust; callers own the network."

[dependencies]
ciborium = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
p384 = { version = "0.13", features = ["ecdsa"] }
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std"] }
