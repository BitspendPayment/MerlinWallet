[package]
name = "ark"
version = "0.1.0"
edition = "2021"

[lib]
name = "ark"

[dependencies]
threshold = { path = "../threshold" }

# Optional deps for the `client` feature (ASP communication + ark-core types)
ark-core = { version = "0.9", optional = true }
bitcoin = { version = "0.32", features = ["serde"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tonic = { version = "0.12", optional = true, features = ["tls-webpki-roots"] }
prost = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = []
std = ["threshold/std"]
# `exit`: building and finalizing a unilateral exit spend (src/exit.rs). ark-core and bitcoin only —
# no prost, no tonic-build, so the FFI can enable it without `protoc` on every cross-build host.
exit = ["std", "ark-core", "bitcoin", "hex"]
# `signing`: tx-building + FROST/MuSig2 signing math + prost message types. Builds for
# wasm32-wasip2 (no tonic/tokio) — this is what the cosigner guest enables.
signing = ["std", "exit", "ark-core", "bitcoin", "prost", "serde", "serde_json", "rand", "hex", "tonic-build"]
# `client`: adds the ASP gRPC transport (tonic/tokio) on top of `signing` — host-only.
client = ["signing", "tokio", "tonic", "tokio-stream"]

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
