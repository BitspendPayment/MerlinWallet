// The cosigner's whole API.
//
// A signing ceremony as ONE bidirectional session.
//
// The unary `SignStep1`/`SignStep2` pair in mpc_wallet.proto makes the server hold a FROST nonce in
// memory between two requests. Under a per-request runtime there is no "between", so the nonce would
// have to persist — and a reused nonce leaks a secret share. One stream removes the problem instead
// of managing it: the ceremony is one instance, the nonce never leaves it, and a stream that dies
// takes the nonce with it. A reconnect is a new session with a new nonce.
//
// Shape follows enclave-runtime's `enclave.cosign.v1` prototype: a client-owned session id, a
// sequence number, and a typed body per round.
syntax = "proto3";

import "mpc_wallet.proto";

package cosigner.v1;

// ---------------------------------------------------------------------------------------------------
// Where `user_id`, `signature` and `timestamp_ms` went
//
// Every request used to carry them: a Schnorr signature by the wallet's share key over an op tag and a
// timestamp, which the cosigner checked before doing anything. That was authentication, and it lived
// in the guest because nothing in front of it did any.
//
// Something does now. enclave-runtime gates every request on a WebAuthn assertion bound to that exact
// method and path, and a request reaches the guest only once that has verified — with the tenant it
// resolved stamped on as `x-enclave-tenant`, a header it strips from anything a client sends. So the
// cosigner requires that header and nothing more. The body signature was not merely redundant: a
// passkey-gated wallet holds no plaintext share, so it could not produce one at all.
//
// The fields are reserved rather than reused, so a client still sending them fails to parse instead of
// having its bytes read as something else.
// ---------------------------------------------------------------------------------------------------

service Cosigner {
  // Both directions open at once: the server answers each round as it arrives.
  rpc Sign(stream SignClientMsg) returns (stream SignServerMsg);

  // DKG is the same problem with higher stakes: three unary calls (DKGStep1/2/3) had the server
  // holding round-1 and round-2 secrets between them, and those secrets are how the key is born.
  //
  // Two exchanges here, not three. Step 2 did nothing a caller needed — it recomputed the server's
  // round 2 and returned the round-1 packages step 1 had already returned — so it existed only to
  // give the unary API somewhere to trigger that from. What is left is the ceremony itself: the
  // wallet's round 1 in and everybody's out, then its round 2 in and the server's out with the key.
  rpc Dkg(stream DkgClientMsg) returns (stream DkgServerMsg);

  // A send, with the wallet driving the ASP: the cosigner builds it and signs its half, the wallet
  // submits and finalizes, and the cosigner records it only once it is final.
  //
  // The same steps fund an escrow — a plain send to its address — and take back what is left of
  // one (`reclaim_escrow`).
  rpc Send(stream SendClientMsg) returns (stream SendServerMsg);

  // Renewing, with the client driving the ASP round.
  //
  // The cosigner used to hold the ASP connection: it registered the intent, opened the event
  // stream, and reacted to each event itself. That made it the Ark client as well as the signer.
  // Here the client drives the round and relays each event; the cosigner answers with what to
  // submit next, and never opens a socket.
  rpc Renew(stream RenewClientMsg) returns (stream RenewServerMsg);

  // Boarding: settling one on-chain output into Ark, through the same round as `Renew`. A ceremony
  // of its own rather than a flag on `Renew`'s open, but every message after the open is the same,
  // so it carries `Renew`'s messages and opens with `RenewClientMsg.board`.
  rpc Board(stream RenewClientMsg) returns (stream RenewServerMsg);

  // The rest. Not ceremonies — one round each, with nothing to hold between messages, so a stream
  // would buy nothing.
  //
  // Deployment metadata: the Bitcoin network, so a caller renders addresses with the right HRP
  // without having to be told separately. Unauthenticated.
  rpc GetServerInfo(mpc_wallet.GetServerInfoRequest) returns (mpc_wallet.GetServerInfoResponse);

  // Enrolling a device for wake signals, forwarded to the runtime.
  //
  // The cosigner does not keep the token and cannot send a message: it has no outbound socket. The
  // runtime owns the registry and the FCM channel — `enclave:notify/notify` — and the cosigner only
  // spends an enrolment, by calling `wake` from a background task when a settle comes due. That is
  // also why these are interactive-only there, and why `DeviceCount` returns a number rather than
  // the tokens: the cosigner is not meant to be able to enumerate a tenant's devices.
  //
  // Nothing woken this way carries readable text. The payload crosses the parent instance and
  // Google; the app wakes on an opaque category and fetches the detail over this channel.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc ForgetDevice(ForgetDeviceRequest) returns (ForgetDeviceResponse);
  rpc DeviceCount(DeviceCountRequest) returns (DeviceCountResponse);

  // Rebuilding a wallet on a new device, from nothing but its passkey.
  //
  // A wallet's FROST share is the sum of both dealers' polynomials at its identifier. The owner
  // re-derives its own dealer from the passkey's PRF — the same passkey, on any device it syncs to,
  // gives the same polynomial — and this returns the other half, the share the cosigner dealt it
  // when the wallet was made. Neither half is the key. Together they are, which is why this answers
  // only for the identifier the ceremony recorded, and only to a caller the runtime has already
  // authenticated as this tenant.
  //
  // It reads; it never installs. A recovery that re-keyed would strand everything the seal holds.
  rpc Recover(RecoverRequest) returns (RecoverResponse);

  // Minting an escrow key: one reshare between the two parties that already hold this wallet.
  //
  // `V' = V + delta_wallet + delta_cosigner` — a second 2-of-2 over a key of its own, held by the
  // same pair. The wallet's key is untouched, which is the point: a service can be paired into an
  // escrow without being paired into the wallet, and escrowed money is visibly separate from the
  // rest. Two exchanges, the same shape as `Dkg`, and the secrets live on one handler's stack.
  //
  // Optionally it then pairs a service into the new escrow: a key-preserving refresh giving the
  // service a share of the SAME key, so `{service, cosigner}` can sign it too. The cosigner's half
  // of that share goes straight to the service, over an origin THIS IMAGE names; the wallet sends
  // its own half to the same origin, then confirms here. The pairing is usable only once the
  // service has confirmed as well. See `cosigner/src/handlers/delivery.rs`.
  //
  // And with the pairing, the deal: what the service may take, and until when — struck once the
  // wallet has delivered its half, on the same approval. One escrow, one deal: an escrow is never
  // committed again, so the next payment mints the next escrow. See
  // `cosigner/src/escrow_session.rs`.
  rpc Escrow(stream EscrowClientMsg) returns (stream EscrowServerMsg);

  // The escrow keys this wallet holds. Public projection only — a device that keeps nothing asks
  // what exists rather than remembering.
  rpc EscrowList(EscrowListRequest) returns (EscrowListResponse);
}

// 32-512 characters of [A-Za-z0-9_:.-], as `notify.wit` specifies.
message RegisterDeviceRequest {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  string token = 4;
}
message RegisterDeviceResponse {}

message ForgetDeviceRequest {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  string token = 4;
}
message ForgetDeviceResponse {}

message DeviceCountRequest {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
}
// How many devices are enrolled. Never which.
message DeviceCountResponse {
  uint32 devices = 1;
}

// The identifier the caller re-derived from its passkey, to be matched against the ceremony's.
message RecoverRequest {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  // 32 bytes, big-endian: `Identifier::derive(compressed(a0*G))`.
  bytes identifier = 4;
}
// Everything the wallet cannot derive for itself.
message RecoverResponse {
  // `f_cosigner(identifier)`, 32 bytes big-endian. Half of the caller's signing share.
  bytes dealt_share = 1;
  // The ceremony's public key package, JSON: the group key and every verifying share. The caller
  // checks its rebuilt share against its own verifying share in here before saving anything.
  string public_key_package_json = 2;
  // The group key, hex — also inside the package above, returned plainly so a caller can compare
  // without parsing.
  string group_key = 3;
  // The escrows this wallet holds, so a new device can rebuild them the way it rebuilt the wallet:
  // each carries the context its delta was derived under. Public throughout.
  repeated EscrowSummary escrows = 4;
}

message RenewClientMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    RenewOpen open = 3;
    RenewSigned signed = 4;
    IntentRegistered registered = 5;
    AspEvent event = 6;
    // After `RenewComplete`, optionally: renew the delegate over the wallet's set as it now stands.
    RenewDelegate renew_delegate = 7;
    // Opens a `Board` stream, where `open` opens a `Renew` one.
    BoardOpen board = 8;
  }
}

// Opens a renewal of the VTXOs the wallet holds. Boarding opens a stream of its own — see
// `BoardOpen`.
//
// `ark_info` comes from the caller because the caller is the one talking to the ASP. Lying about it
// yields a transaction the ASP will not accept, or an address the liar cannot spend from — the
// cosigner still derives every output from ITS OWN key, so a wrong `signer_pubkey` cannot redirect
// funds, only waste a round.
message RenewOpen {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  // Boarding has its own stream now: see `Board`.
  reserved 4;
  reserved "boarding_utxo";
  mpc_wallet.ArkInfo ark_info = 5;
  // The set to refresh.
  repeated VtxoInput vtxos = 6;
  // Refresh nothing now: renew the delegate over `vtxos` and close. The in-band exchange
  // `RenewDelegate` describes — `sighashes`, `signed`, `delegate_renewed` — with no round before
  // it.
  bool delegate_only = 7;
  // With `delegate_only`: the device token the renewal carries, as `RenewDelegate.device_token`.
  string device_token = 8;
  // With `delegate_only`: where a unilateral exit pays, as `RenewDelegate.exit_script_pubkey`.
  bytes exit_script_pubkey = 9;
  // The wallet's FROST identifier, 32 bytes big-endian — what `RecoverRequest.identifier` is.
  //
  // The cosigner answers the first round with the half of the wallet's share it dealt at DKG (see
  // `wallet_dealt_share`), and only to the identifier the ceremony recorded. The identifier is
  // public, so this authenticates nobody — the runtime did that, per tenant. What it catches is a
  // wallet that is not this one: a wrong passkey, or a PRF that answers differently.
  bytes identifier = 10;
}

// Opens a `Board` stream: settle `utxo`, an on-chain output paying this wallet's boarding address,
// into Ark. `ark_info` and `identifier` are as in `RenewOpen`.
message BoardOpen {
  BoardingUtxo utxo = 1;
  mpc_wallet.ArkInfo ark_info = 2;
  bytes identifier = 3;
}

message BoardingUtxo {
  string txid = 1;
  uint32 vout = 2;
  uint64 amount_sats = 3;
}

// One VTXO the caller says it holds.
//
// The cosigner used to learn its VTXO set from an ASP subscription it no longer runs, so a VTXO
// received from another wallet had no way in and could never be spent. The caller supplies them
// now, and the cosigner VALIDATES each against the scriptPubKey it derives from its own owner key
// — so a lying caller can only name an input that does not exist, which the ASP rejects. Ownership
// stays cosigner-derived; only existence is taken on trust, and existence is not a secret.
message VtxoInput {
  string txid = 1;
  uint32 vout = 2;
  uint64 amount_sats = 3;
  uint32 exit_delay = 4;
  // Unix seconds the ASP says it expires at, as the indexer reports it. 0 when not yet known. Only
  // ever used to schedule a wake — a wrong value costs the wallet an early or late reminder, not
  // funds — so it is taken as given.
  int64 expires_at = 5;
}

// Renew the delegate over these VTXOs: the wallet's whole current set.
//
// A VTXO has to be refreshed in a batch round before the ASP's expiry. A delegate lets the cosigner
// do that alone: the wallet signs, now, an intent to refresh everything it holds — valid from the
// earliest expiry less a safety margin — and the forfeits the round will need, and the cosigner
// seals them. When the deadline comes, its background task registers the intent with its ASP itself,
// follows the round, and signs the tree with its own key. No wallet signature, no phone.
//
// Sent in-band as the last exchange of `Send` and `Renew`, once the operation's result is indexed:
// the cosigner answers with the sighashes to sign (in the stream's `sighashes`), the wallet with
// `signed`, and the cosigner with `delegate_renewed`. It rides the approval the operation already
// had, and the passkey seed the operation already derived. `RenewOpen.delegate_only` does it on its
// own, for funds that arrived by a receive.
message RenewDelegate {
  repeated VtxoInput vtxos = 1;
  mpc_wallet.ArkInfo ark_info = 2;
  // This device's push token, when the cosigner has not been given it yet — see `DkgOpen`.
  string device_token = 3;
  // Where a unilateral exit should pay: a scriptPubKey the wallet's owner controls somewhere else.
  //
  // With it, the cosigner also builds one exit transaction per VTXO — a spend through the VTXO's
  // own exit leaf, after its relative timelock — and signs it in the same FROST round as the
  // delegate. The wallet keeps those transactions and can broadcast them with nobody's help,
  // which is the one thing it cannot do if this cosigner stops answering. Empty means the wallet
  // has no exit address yet, and then no exits are built.
  bytes exit_script_pubkey = 4;
}

// One signed unilateral exit: everything needed to broadcast it, and nothing to be interpreted
// first.
message ExitTx {
  // The VTXO it spends, `txid:vout`.
  string outpoint = 1;
  // The complete transaction, consensus-serialised.
  bytes raw_tx = 2;
  // The nSequence it carries: the VTXO's exit delay, BIP-68 encoded. It cannot confirm until that
  // long after the transaction that created the VTXO did.
  uint32 sequence = 3;
  // What it pays out, which is the whole VTXO — an exit pays no fee, and carries an anchor output
  // for whoever bumps it.
  uint64 amount_sats = 4;
  // Deliberately no txid: the wallet derives it from `raw_tx` while checking that the exit is the
  // one it signed (`ark_verify_exit_tx`). An identity it can compute is not one to be told.
}

message DelegateRenewed {
  // When the delegate becomes valid and the cosigner will run it: the earliest expiry, less the
  // margin. Unix seconds.
  uint64 valid_at_secs = 1;
  // That margin, so the wallet can tell whether a VTXO that arrives later expires before it.
  uint64 margin_secs = 2;
  // `txid:vout` of each VTXO the delegate refreshes.
  repeated string covered = 3;
  // Whether the `device_token` that came with the seal was enrolled for wakes.
  bool device_enrolled = 4;
  // One per VTXO, when the seal carried an `exit_script_pubkey`.
  repeated ExitTx exit_txs = 5;
}

message RenewSigned {
  // The wallet's half of each message's FROST round, in the order the sighashes arrived.
  //
  // This used to be `signed_messages` — finished 64-byte signatures the wallet produced by opening
  // a nested `Sign` stream per sighash while this stream waited. That deadlocks inside
  // enclave-runtime, which runs one request per tenant for the whole life of a stream: this stream
  // holds the tenant, the nested one waits for it, and nothing moves until the interaction deadline
  // kills both. So the round rides here instead, and the cosigner aggregates.
  //
  // Reserved rather than reused: a client still sending finished signatures in field 1 must fail
  // to parse, not have its bytes read as something else.
  reserved 1;
  reserved "signed_messages";
  repeated WalletRound rounds = 2;
}

// The id the ASP returned for `RegisterIntent`. The cosigner needs it to tell its own batch from
// the ones a public ASP broadcasts for everybody else.
message IntentRegistered {
  string intent_id = 1;
}

// One `GetEventStreamResponse`, as it came off the ASP stream.
message AspEvent {
  bytes encoded = 1;
}

message RenewServerMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    RenewSighashes sighashes = 3;
    RegisterIntent register = 4;
    AspSubmit submit = 5;
    RenewIdle idle = 6;
    RenewComplete complete = 7;
    // The delegate, renewed. See `RenewDelegate`.
    DelegateRenewed delegate_renewed = 8;
  }
}

message RenewSighashes {
  repeated bytes messages_to_sign = 1;
  bool script_path_spend = 2;
  // In-band FROST, round one: the cosigner's commitment for each message, in the same order.
  //
  // It commits first so the whole batch costs one round trip. FROST needs both commitments before
  // either share, not the wallet's before the cosigner's — so the wallet, holding these, can commit
  // and compute its share in the same step.
  repeated Commitment cosigner_commitments = 3;
  // Whose commitments those are: the FROST identifier the aggregate keys them under, hex.
  string cosigner_identifier = 4;
  // The exit transactions' sighashes, when the seal asked for exits. One round signs both halves:
  // `cosigner_commitments` runs over `messages_to_sign` first and these after, in order, and the
  // wallet's `rounds` come back in that same order.
  repeated bytes exit_messages = 5;
  // `f_cosigner(wallet identifier)`, 32 bytes big-endian: what the cosigner dealt this wallet at
  // DKG, and half of the wallet's signing share — the wallet adds the half it re-derives from its
  // passkey and keeps neither. NOT the cosigner's own share, which never leaves it.
  //
  // On the FIRST sighashes of a stream only, and empty on every one after: one approved stream is
  // one reconstruction, and the rounds that follow reuse it.
  bytes wallet_dealt_share = 6;
}

// What the caller must send the ASP as `RegisterIntent`, followed by `GetEventStream(topics)`.
message RegisterIntent {
  string proof = 1;
  string message = 2;
  repeated string topics = 3;
}

// The event was consumed and produced nothing to send. The caller relays the next one.
message RenewIdle {}

// One ASP call the caller must make on the cosigner's behalf.
message AspSubmit {
  oneof call {
    ConfirmRegistration confirm_registration = 1;
    TreeNonces tree_nonces = 2;
    TreeSignatures tree_signatures = 3;
    ForfeitTxs forfeit_txs = 4;
  }
}

message ConfirmRegistration { string intent_id = 1; }
message TreeNonces {
  string batch_id = 1;
  string pubkey = 2;
  map<string, string> nonces = 3;
}
message TreeSignatures {
  string batch_id = 1;
  string pubkey = 2;
  map<string, string> signatures = 3;
}
// The ASP's `SubmitSignedForfeitTxs` takes these separately. They were packed into one list, which
// made a single-element list ambiguous between a lone forfeit and a lone commitment.
message ForfeitTxs {
  repeated string signed_forfeit_txs = 1;
  string signed_commitment_tx = 2;
}

message RenewComplete {
  string commitment_txid = 1;
  string vtxo_txid = 2;
  uint32 vtxo_vout = 3;
  uint64 amount_sats = 4;
  uint32 exit_delay = 5;
}

message SendClientMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    SendOpen open = 3;
    SendSigned signed = 4;
    SendSubmitted submitted = 5;
    SendFinalized finalized = 6;
    // After `SendComplete`, optionally: renew the delegate over the wallet's set as it now stands.
    RenewDelegate renew_delegate = 7;
  }
}

// What the ASP returned for `SubmitTx`.
message SendSubmitted {
  string ark_txid = 1;
  repeated string signed_checkpoint_txs = 2;
}

// `FinalizeTx` was accepted. Only now is the send durable enough to seal.
message SendFinalized {}

// Opens the send. The VTXOs to spend are not listed: the cosigner selects them from the set it
// already holds, so a caller cannot nominate inputs it does not own.
message SendOpen {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  string recipient_ark_address = 4;
  uint64 amount = 5;
  mpc_wallet.ArkInfo ark_info = 6;
  // The set to spend from. The cosigner still selects WHICH of these to use and checks the
  // balance itself; it validates every one against its own derived scriptPubKey first.
  repeated VtxoInput vtxos = 7;
  // The wallet's FROST identifier, 32 bytes big-endian — what `RecoverRequest.identifier` is.
  //
  // The cosigner answers the first round with the half of the wallet's share it dealt at DKG (see
  // `wallet_dealt_share`), and only to the identifier the ceremony recorded. The identifier is
  // public, so this authenticates nobody — the runtime did that, per tenant. What it catches is a
  // wallet that is not this one: a wrong passkey, or a PRF that answers differently.
  bytes identifier = 8;
  // Once committed the escrow a send topped up to a deal. The deal is struck on `Escrow` now.
  reserved 9;
  reserved "escrow_commit";
  // Set, to take back what is left of this escrow (compressed hex) instead of sending: the
  // `{wallet, cosigner}` pairing over the escrow's key, refused while a deal holds it. `vtxos` are
  // then the escrow's — named by the wallet, which is safe because a taproot sighash commits to
  // every prevout — and the destination is NOT named: `recipient_ark_address` and `amount` must be
  // empty. It is this wallet's own address, derived by the cosigner from the key it holds, so a
  // reclaim cannot be pointed anywhere else.
  string reclaim_escrow = 10;
}

message SendSigned {
  // The wallet's half of each message's FROST round, in the order the sighashes arrived.
  //
  // This used to be `signed_messages` — finished 64-byte signatures the wallet produced by opening
  // a nested `Sign` stream per sighash while this stream waited. That deadlocks inside
  // enclave-runtime, which runs one request per tenant for the whole life of a stream: this stream
  // holds the tenant, the nested one waits for it, and nothing moves until the interaction deadline
  // kills both. So the round rides here instead, and the cosigner aggregates.
  //
  // Reserved rather than reused: a client still sending finished signatures in field 1 must fail
  // to parse, not have its bytes read as something else.
  reserved 1;
  reserved "signed_messages";
  repeated WalletRound rounds = 2;
}

message SendServerMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    SendSighashes sighashes = 3;
    SendSubmit submit = 4;
    SendFinalize finalize = 5;
    SendComplete complete = 6;
    // The delegate, renewed. See `RenewDelegate`.
    DelegateRenewed delegate_renewed = 7;
  }
}

// Send these to the ASP as `SubmitTx`.
message SendSubmit {
  string ark_tx_b64 = 1;
  repeated string checkpoint_txs = 2;
}

// Send these to the ASP as `FinalizeTx`.
message SendFinalize {
  string ark_txid = 1;
  repeated string final_checkpoint_txs = 2;
}

message SendSighashes {
  repeated bytes messages_to_sign = 1;
  bool script_path_spend = 2;
  // In-band FROST, round one: the cosigner's commitment for each message, in the same order.
  //
  // It commits first so the whole batch costs one round trip. FROST needs both commitments before
  // either share, not the wallet's before the cosigner's — so the wallet, holding these, can commit
  // and compute its share in the same step.
  repeated Commitment cosigner_commitments = 3;
  // Whose commitments those are: the FROST identifier the aggregate keys them under, hex.
  string cosigner_identifier = 4;
  // As `RenewSighashes.exit_messages`.
  repeated bytes exit_messages = 5;
  // `f_cosigner(wallet identifier)`, 32 bytes big-endian: what the cosigner dealt this wallet at
  // DKG, and half of the wallet's signing share — the wallet adds the half it re-derives from its
  // passkey and keeps neither. NOT the cosigner's own share, which never leaves it.
  //
  // On the FIRST sighashes of a stream only, and empty on every one after: one approved stream is
  // one reconstruction, and the rounds that follow reuse it.
  bytes wallet_dealt_share = 6;
  // On a reclaim only. The sighashes are then the ESCROW key's, and the wallet rebuilds its share
  // of it from `wallet_dealt_share`, this cosigner's delta share for the escrow, and the passkey.
  bytes escrow_delta_share = 7;
  // Where a reclaim goes, and how much: derived here, reported so the owner sees what they sign.
  string to_ark_address = 8;
  uint64 amount_sats = 9;
}

message SendComplete {
  string ark_txid = 1;
  // The change VTXO the send produced, absent when it spent the inputs exactly.
  ChangeVtxo change = 2;
  reserved 3;
  reserved "committed";
}

message ChangeVtxo {
  string txid = 1;
  uint32 vout = 2;
  uint64 amount_sats = 3;
  uint32 exit_delay = 4;
}

message SignClientMsg {
  // The client's, never the server's. Correlation only — nothing is keyed on it, because a stream
  // that dies takes its session with it regardless of what it was called.
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    SignOpen open = 3;
    SignShare share = 4;
  }
}

// Opens the session and carries the whole of what the old SignStep1Request carried.
//
// Authentication happens HERE, once, for the session — not per message. That mirrors the runtime
// this is heading for, where one passkey assertion authorizes one interaction and the messages
// inside it are not individually approved.
//
// Deliberately NO per-message approval field. Verifying an assertion needs the stored credential,
// the issued challenge and the relying-party configuration; a field that looks like a credential
// and is never checked reads as a guarantee it does not provide. Per-message approval needs a host
// function that does not exist yet — see enclave-runtime docs/STREAMING.md.
message SignOpen {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  // The wallet's commitments rode here once. They cannot any more: its nonce is hedged with its
  // share, and the share does not exist until the cosigner's first answer brings the half it
  // dealt. So the cosigner commits first, as it already did in-band, and the wallet's commitments
  // travel with its share — see `SignShare`.
  reserved 4, 5;
  reserved "hiding_commitment", "binding_commitment";
  bytes message_to_sign = 6;
  // The transaction the policy inspects. Bound to `message_to_sign` by the cosigner before any
  // policy runs, so a compliant transaction cannot front a signature over something else.
  bytes full_transaction = 7;
  // Must be true. The cosigner signs untweaked and verifies every share before aggregating, so a
  // key-path (tweaked) share could never have aggregated here; it is refused by name instead.
  bool script_path_spend = 8;
  // The wallet's FROST identifier, 32 bytes big-endian — what `RecoverRequest.identifier` is.
  //
  // The cosigner answers the first round with the half of the wallet's share it dealt at DKG (see
  // `wallet_dealt_share`), and only to the identifier the ceremony recorded. The identifier is
  // public, so this authenticates nobody — the runtime did that, per tenant. What it catches is a
  // wallet that is not this one: a wrong passkey, or a PRF that answers differently.
  bytes identifier = 9;
}

// The wallet's whole half of the round: its commitments, and its share computed over both its own
// and the cosigner's.
message SignShare {
  bytes signature_share = 1;
  bytes hiding_commitment = 2;
  bytes binding_commitment = 3;
}

message SignServerMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    SignCommitments commitments = 3;
    SignComplete complete = 4;
  }
}

message Commitment {
  bytes hiding = 1;
  bytes binding = 2;
}

// One message's worth of the wallet's side of an in-band FROST round: its commitment, and its
// share computed over both its own commitment and the cosigner's.
message WalletRound {
  bytes hiding = 1;
  bytes binding = 2;
  // 32 bytes, big-endian.
  bytes share = 3;
}

message SignCommitments {
  // The cosigner's commitment, keyed by its FROST identifier, hex. One entry.
  map<string, Commitment> commitments = 1;
  // Echoed back because the cosigner is authoritative about what it will sign: if this differs from
  // what was asked for, the caller is told rather than silently signing something else.
  bytes message_to_sign = 2;
  // `f_cosigner(wallet identifier)`, 32 bytes big-endian — see `SendSighashes.wallet_dealt_share`.
  bytes wallet_dealt_share = 3;
}

message SignComplete {
  bytes r_point = 1;
  bytes z_scalar = 2;
}

// ---------------------------------------------------------------------------
// DKG: one session, three rounds.
// ---------------------------------------------------------------------------

message DkgClientMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    DkgOpen open = 3;
    DkgRound2 round2 = 4;
  }
}

// Opens the session and authenticates it once, for the whole ceremony, carrying the wallet's
// round-1 package.
message DkgOpen {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  bytes identifier = 4;
  string round1_package = 5; // JSON
  // This device's push token, enrolled for wakes once the key exists.
  //
  // Carried here, not sent as a `RegisterDevice` of its own, because every call is a passkey
  // approval: a separate enrolment right after onboarding was a second fingerprint for nothing the
  // user asked for. A token FCM rotates later rides the next `RenewDelegate` the same way — a wake
  // is only ever about a renewed delegate, so none is missed by waiting for one.
  string device_token = 6;
}

// The wallet's round-2 packages, one per recipient.
message DkgRound2 {
  bytes identifier = 1;
  map<string, string> round2_packages_for_others = 2; // JSON per recipient
}

message DkgServerMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    DkgRound1Out round1 = 3;
    DkgComplete complete = 4;
  }
}

// Every dealer's round-1 package, id_hex → JSON.
message DkgRound1Out { map<string, string> round1_packages = 1; }

message DkgComplete {
  // The round-2 packages addressed to the wallet, sender id_hex → JSON.
  map<string, string> round2_packages_for_me = 1;
  // The group key the ceremony produced. The wallet derives the same one from its own part 3;
  // this is here so it can check them against each other rather than discover a mismatch later.
  string group_key = 2;
  // Whether `DkgOpen.device_token` was enrolled for wakes. Not having been is not a failed ceremony.
  bool device_enrolled = 3;
}

// --- Escrow -------------------------------------------------------------------------------------
//
// A reshare between the wallet and this cosigner, producing a key only they hold. Both deal a fresh
// non-zero delta under the identifiers they already have, both finalize, and neither side's wallet
// share changes. See `cosigner/src/handlers/escrow.rs`.

message EscrowClientMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    EscrowOpen open = 3;
    EscrowRound2 round2 = 4;
    // After `EscrowComplete`, when `EscrowOpen` named a service: pair it into the new escrow on
    // this same approval — the wallet's dealing, then word that its own half was delivered.
    PairServiceDeal deal = 5;
    PairServiceConfirmRequest delivered = 6;
  }
}

message EscrowOpen {
  // The wallet's FROST identifier in its OWN key — the reshare is dealt under the identifiers both
  // parties already have, so the deltas land on the same points as the old shares.
  bytes identifier = 1;
  // JSON: the wallet's delta dealing.
  string round1_package = 2;
  // What separates this escrow's delta from the next one's in the wallet's key derivation. Recorded
  // so a repeat is refused: two escrows dealt on one delta are two points on one line, and two
  // points determine it. 16 bytes, drawn fresh by the wallet.
  bytes context = 3;
  // Optionally, a service to pair into the escrow once it is minted. Both empty: mint only.
  //
  // The service's FROST identifier, 32 bytes. The IMAGE resolves it to an origin; a wallet never
  // names one. An id this image does not know is refused before anything is dealt.
  bytes service_identifier = 4;
  // What ties the two halves together at the service, 16 bytes, drawn fresh for each attempt.
  bytes attempt_id = 5;
  // The deal, struck once the service is paired in and the wallet has delivered its half. Named
  // with a service and only with one: a deal nobody can release under would lock the money away
  // until the deadline for no one's benefit. Validated before anything is dealt.
  //
  // Both pairings sign the same key, so which of them gets a signature is a DECISION this cosigner
  // makes on sealed state — not something the key enforces. Until the deadline the service may
  // release and the owner may not reclaim; afterwards those swap. There is deliberately no way for
  // the owner to END one: a service that had already paid against it would be left holding the
  // loss. Her control is the deadline she chooses here.
  //
  // What a release must satisfy, as the policy IR's JSON — `cosigner/src/policy.rs`. An absent or
  // unparseable policy releases NOTHING: the IR's default is `never`.
  string policy_json = 6;
  // Unix seconds. After this the service may no longer take and the owner may reclaim.
  int64 deadline_secs = 7;
}

// JSON: the wallet's share of its own delta, addressed to the cosigner.
message EscrowRound2 { string round2_package = 1; }

message EscrowServerMsg {
  string session_id = 1;
  uint64 seq = 2;
  oneof body {
    EscrowRound1Out round1 = 3;
    EscrowComplete complete = 4;
    // The pairing that follows, when one was asked for: the cosigner's half delivered and sealed
    // pending, then the wallet's confirmation taken.
    PairServiceDone paired = 5;
    PairServiceConfirmResponse confirmed = 6;
  }
}

message EscrowRound1Out {
  // JSON: the cosigner's delta dealing.
  string round1_package = 1;
  // `f_cosigner(wallet identifier)`, 32 bytes big-endian — see `SendSighashes.wallet_dealt_share`.
  //
  // A reshare adds a delta to the wallet's EXISTING share, so the wallet has to rebuild that share
  // before it can finalize. It keeps none, so the half it cannot derive rides this stream exactly
  // as it rides every other, once, and never the cosigner's own share.
  bytes wallet_dealt_share = 2;
}

message EscrowComplete {
  // JSON: the cosigner's share of its delta, addressed to the wallet. With this the wallet
  // finalizes its own side and arrives at the same key.
  string round2_package = 1;
  // `V'`, compressed hex. The wallet derives the same one; this is here so a mismatch is caught now
  // rather than when money is already in it.
  string escrow_key = 2;
}

message PairServiceDeal {
  // The wallet's contribution to the cosigner: a 32-byte scalar.
  bytes contribution_to_cosigner = 1;
  // The wallet's contribution to the service: a 33-byte compressed POINT, and never the scalar
  // behind it. A cosigner holding both that scalar and its own counter-share would have two points
  // on one line; it checks this point against public data instead. See `handlers/pairing.rs`.
  bytes contribution_to_service = 2;
}

message PairServiceDone {
  // The pairing's public key package, JSON. Its verifying key is the escrow key, unchanged.
  string public_key_package_json = 1;
  // The verifying share the service's assembled share must match, hex.
  string service_verifying_share = 2;
  // Where this enclave delivered its own half, resolved from the IMAGE's `SERVICE_ORIGINS`.
  //
  // Returned so the wallet sends its contribution to the same place rather than choosing one: the
  // wallet has no business knowing where a service lives, and two halves delivered to two
  // different hosts would split a share between them. The wallet trusts this because it trusts
  // the attestation that says which image is running.
  string service_origin = 3;
  // The attempt id, echoed. The wallet sent it, so it labels its own delivery with that.
  reserved 4;
  reserved "attempt_id";
}

// The wallet's word, on the `Escrow` stream, that the service took its half.
message PairServiceConfirmRequest {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
  string escrow_key = 4;
  // The attempt being confirmed. A confirmation for any other attempt is refused: it would mark a
  // pairing usable on the strength of a different pairing's delivery.
  bytes attempt_id = 5;
}

// The wallet's confirmation taken, and the deal `EscrowOpen` named struck and sealed.
message PairServiceConfirmResponse {
  // What the owner agreed to, rendered for consent — `Policy::describe`.
  string policy_description = 1;
  int64 deadline_secs = 2;
}

message EscrowListRequest {
  // Authentication is the runtime's — see the note at the top of this file.
  reserved 1, 2, 3;
  reserved "user_id", "signature", "timestamp_ms";
}

message EscrowListResponse { repeated EscrowSummary escrows = 1; }

// What a wallet needs to operate an escrow, and nothing secret.
message EscrowSummary {
  string escrow_key = 1;
  // This wallet's FROST identifier in that escrow.
  bytes wallet_identifier = 2;
  // The escrow's public key package, JSON: the group key and both verifying shares. What a rebuilt
  // share is checked against.
  string public_key_package_json = 3;
  int64 created_at = 4;
  // The service paired into this escrow, hex, or empty when none is.
  string service_identifier = 5;
  // Whether that pairing is finished. BOTH parties have to say so, and each can answer only for
  // itself — so the two are reported separately as well as together. A pending pairing is not
  // usable: nothing is released through it, so an escrow is funded only once it is ready.
  bool service_ready = 7;
  // The service said, over the connection the cosigner's runtime holds to it, that it has both
  // halves and that the share they sum to matches the published verifying share. Only the service
  // can know this: it is the only party that ever holds both halves.
  bool service_confirmed = 8;
  // The wallet said it delivered its own half and the service took it. Only the wallet can know
  // this: its half travels device-to-service and never through the cosigner.
  bool wallet_confirmed = 9;
  // The escrow's deal, absent when the session that minted it ended before striking one.
  EscrowSessionSummary session = 6;
  // The derivation context the wallet's delta was minted under — what a new device needs to
  // re-derive it. Not a secret: it is meaningless without the PRF, and the cosigner holds it.
  bytes context = 10;
  reserved 11;
  reserved "reclaim_opened";
}

message EscrowSessionSummary {
  // Whether a release would be accepted right now. The clock against the deadline, and nothing
  // else — there is no state, and no way to end a deal early. Projected so a caller need not
  // reimplement the rule.
  bool open = 1;
  int64 deadline_secs = 2;
  int64 opened_at = 3;
  uint64 released_sats = 4;
  string policy_description = 5;
}
