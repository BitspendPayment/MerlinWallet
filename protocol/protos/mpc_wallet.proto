syntax = "proto3";

package mpc_wallet;

service MPCWallet {
  // DKG
  rpc DKGStep1 (DKGStep1Request) returns (DKGStep1Response);
  rpc DKGStep2 (DKGStep2Request) returns (DKGStep2Response);
  rpc DKGStep3 (DKGStep3Request) returns (DKGStep3Response);

  // Contract creation (PEER model). NO reshare and NO new key: the wallet's existing 2-of-2
  // key V is reused; the contract is enforced by the cosigner gate (WASM evaluate +
  // verifying-share allowlist), not by a distinct key. A single step REFRESHES V onto a
  // {receiver, cosigner} pairing (key unchanged) so the chosen RECEIVER (another user) can
  // co-sign. Both halves of the receiver's share are ECIES-encrypted to its verifying key and
  // dropped into the receiver's pickup inbox: the wallet's a@receiver (in the request) and the
  // cosigner's b@receiver. No external service, no URL.
  rpc ContractCreate (ContractCreateRequest) returns (ContractCreateResponse);

  // Inbox pickup (PEER model). The receiver fetches the ECIES contract-share halves held for
  // it, decrypts BOTH with its signing secret, sums them into its share, then acks to clear.
  rpc EvtxoPendingShares (EvtxoPendingSharesRequest) returns (EvtxoPendingSharesResponse);
  rpc EvtxoAckShare (EvtxoAckShareRequest) returns (EvtxoAckShareResponse);

  // Request-to-pay. A party is known by its single group verifying key. A wallet allowlists a
  // contact; that contact may then send it payment requests. The payer's cosigner authenticates
  // the requester, checks the allowlist, DERIVES the requester's Ark address from the allowlisted
  // key (never trusting a supplied address), and records the resulting intent. The payer reviews
  // it and either signs the payment (the normal interactive ark/send) or declines.
  rpc ContactAdd (ContactAddRequest) returns (ContactAddResponse);
  rpc ContactRemove (ContactRemoveRequest) returns (ContactRemoveResponse);
  rpc ContactList (ContactListRequest) returns (ContactListResponse);
  rpc PaymentRequestCreate (PaymentRequestCreateRequest) returns (PaymentRequestCreateResponse);
  rpc PaymentRequestList (PaymentRequestListRequest) returns (PaymentRequestListResponse);
  rpc PaymentRequestDecline (PaymentRequestDeclineRequest) returns (PaymentRequestDeclineResponse);

  // Signing
  // SignStep1/SignStep2 were removed: signing is a bidirectional session now, in
  // cosign_session.proto. Two unary steps made the server park a single-use FROST nonce between
  // requests; a stream owns it for one ceremony and drops it, so there is nothing to persist and
  // nothing to replay.

  // Ark Protocol
  // GetArkInfo, GetArkAddress, GetBoardingAddress and ListVtxos removed. Each was the cosigner
  // fetching public ASP parameters and deriving from a key the client already holds, or listing
  // VTXOs it can no longer observe. The client reads the ASP and derives its own addresses; the
  // cosigner co-signs and verifies.
  // ListArkTransactions removed. The cosigner is called, not running, so it can only log what it
  // performed — a send or a board. Receives were written by a VTXO stream it no longer runs, so
  // the log it could serve is a wallet that never received anything. The client watches its own
  // scripts and owns the history.
  rpc SendVtxo (SendVtxoRequest) returns (SendVtxoResponse);
  rpc RedeemVtxo (RedeemVtxoRequest) returns (RedeemVtxoResponse);

  // Ark Settle (boarding): board on-chain UTXOs into Ark VTXOs.
  // Stateful: call multiple times to drive the batch protocol.
  // Phase 1: call with no signed_messages → returns SIGNING_REQUIRED + intent sighashes
  // Phase 2: call with FROST signatures → registers intent, waits for batch
  // Phase 3: poll → returns SIGNING_REQUIRED for commitment/forfeit, or SETTLED
  rpc Settle (SettleRequest) returns (SettleResponse);

  // Ark SettleDelegate: settle existing VTXOs using the delegate pattern.
  // Only 2 rounds (vs 4 for boarding):
  // Phase 1: call with no signed_messages → returns SIGNING_REQUIRED + all sighashes
  // Phase 2: call with FROST signatures → server drives batch autonomously → SETTLED
  rpc SettleDelegate (SettleDelegateRequest) returns (SettleDelegateResponse);

  // Ark SubmitArkSend: client-built off-chain send, server proxies to ASP.
  rpc SubmitArkSend (SubmitArkSendRequest) returns (SubmitArkSendResponse);

  // Server deployment metadata. Unauthenticated — returns the cosigner-runtime's
  // configured Bitcoin network so clients render addresses with the right HRP
  // without having to know it themselves.
  rpc GetServerInfo (GetServerInfoRequest) returns (GetServerInfoResponse);

  // Register an FCM token so the cosigner can wake the device when a VTXO arrives.
  rpc RegisterDeviceToken (RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse);
}

// DKG Messages

message DKGStep1Request {
  bytes user_id = 1;
  bytes identifier = 2;
  string round1_package = 3; // JSON
  reserved 4; // was is_restore (recovery/restore removed)
}

message DKGStep1Response {
  map<string, string> round1_packages = 1; 
}

message DKGStep2Request {
  bytes user_id = 1;
  bytes identifier = 2;
  string round1_package = 3; // JSON
}

message DKGStep2Response {
   map<string, string> all_round1_packages = 1;
}

message DKGStep3Request {
   bytes user_id = 1;
    bytes identifier = 2;
   map<string, string> round2_packages_for_others = 3;
}

message DKGStep3Response {
    map<string, string> round2_packages_for_me = 1;
}

// Signing Messages

message SignStep1Request {
  bytes user_id = 1;
  bytes hiding_commitment = 2;
  bytes binding_commitment = 3;
  bytes message_to_sign = 4;
  bytes signature = 5; // Schnorr signature over auth message for authentication
  bytes full_transaction = 6;
  int64 timestamp_ms = 7; // Unix timestamp in milliseconds for replay protection
  bool script_path_spend = 8; // If true, skip taproot tweak (script-path signing)
  reserved 9; // was claimed_share — user_id now always carries the signer's verifying
              // share (user or service); routing is by the URL group_key.
  // Service-driven eVTXO spend THROUGH arkd (Tier 2): the second leg (the `ark_tx`
  // that spends the checkpoint output). `full_transaction` carries the checkpoint
  // PSBT (leg 1, spends the eVTXO). When set, a pairing actor's conditioning verifies
  // `message_to_sign` is the sighash of leg 1 OR leg 2, with leg 2 chained to leg 1's
  // checkpoint. Empty for an on-chain single-leg spend (the cosigner overrides the msg).
  bytes ark_tx = 10;
}


message SignStep1Response {
   message Commitment {
       bytes hiding = 1;
       bytes binding = 2;
   }
   map<string, Commitment> commitments = 1;
   bytes message_to_sign = 2; 
   int32 used_key_index = 3; // The key index the server selected for this signing session
}

message SignStep2Request {
   bytes user_id = 1;
   bytes signature_share = 3;
   bytes signature = 4; // Schnorr signature over auth message for authentication
   int64 timestamp_ms = 5; // Unix timestamp in milliseconds for replay protection
   reserved 6; // was claimed_share (see SignStep1Request)
}

message SignStep2Response {
   // Final aggregated signature
   // (R, z)
   bytes r_point = 1;
   bytes z_scalar = 2;
}


// Ark Protocol Messages

message GetArkInfoRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
}

message GetArkInfoResponse {
    string signer_pubkey = 1;
    string forfeit_pubkey = 2;
    string network = 3;
    int64 session_duration = 4;
    int64 unilateral_exit_delay = 5;
    int64 boarding_exit_delay = 6;
    int64 vtxo_min_amount = 7;
    int64 dust = 8;
    string checkpoint_tapscript = 9;
    string forfeit_address = 10;
    // Seconds before a VTXO's expiry that the cosigner auto-settles a stored
    // delegate. Lets the client show an accurate "refreshes around" time.
    int64 auto_settle_safety_margin_secs = 11;
}

message GetArkAddressRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
}

message GetArkAddressResponse {
    string ark_address = 1;
}

message GetBoardingAddressRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
}

message GetBoardingAddressResponse {
    string boarding_address = 1;
}

message VtxoInfo {
    string txid = 1;
    uint32 vout = 2;
    uint64 amount = 3;
    int64 created_at = 4;
    int64 expires_at = 5;
    string status = 6; // "confirmed", "pending", "spent", "expired"
    bool is_preconfirmed = 7;
    uint32 exit_delay = 8; // BIP-68 encoded exit delay for this VTXO
    string script = 9;    // scriptPubKey hex (P2TR) — identifies the VTXO owner
}

message ListVtxosRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
}

message ListVtxosResponse {
    repeated VtxoInfo vtxos = 1;
    uint64 total_balance = 2;
    // True if the cosigner has a stored, signed delegate intent for this user.
    // Clients use this to detect "VTXOs exist but no delegate" (e.g. after
    // cosigner-runtime restart) and re-delegate.
    bool has_active_delegate = 3;
}

message ArkTransactionSummary {
    string tx_type = 1;     // "board", "send", "receive", "settle"
    int64 amount_sats = 2;  // signed: + for inflows, - for outflows
    string txid = 3;
    int64 timestamp = 4;    // seconds since epoch
}

message ListArkTransactionsRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
}

message ListArkTransactionsResponse {
    repeated ArkTransactionSummary transactions = 1;
}

message SendVtxoRequest {
    bytes user_id = 1;
    string recipient_ark_address = 2;
    uint64 amount = 3;
    bytes signature = 4;
    int64 timestamp_ms = 5;
    // FROST signatures for previously requested sighashes (phase 2)
    repeated bytes signed_messages = 6;
}

message SendVtxoResponse {
    enum Status {
        SIGNING_REQUIRED = 0;
        SETTLED = 1;
        ERROR = 2;
    }
    Status status = 1;
    // Sighashes that need FROST signing (when SIGNING_REQUIRED)
    repeated bytes messages_to_sign = 2;
    // Always true for send (script-path spend, no taproot tweak)
    bool script_path_spend = 3;
    // Ark txid when SETTLED
    string ark_txid = 4;
    // Error message when ERROR
    string error_message = 5;
}

message RedeemVtxoRequest {
    bytes user_id = 1;
    string on_chain_address = 2;
    uint64 amount = 3;
    bytes signature = 4;
    int64 timestamp_ms = 5;
}

message RedeemVtxoResponse {
    bool success = 1;
    string txid = 2;
}

// Settle Messages

message BoardingUtxo {
    string txid = 1;
    uint32 vout = 2;
    uint64 amount_sats = 3;
}

message SettleRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
    // FROST signatures for previously requested sighashes (phase 2+)
    repeated bytes signed_messages = 4;
    // Wallet-scanned boarding UTXOs to settle. Required on the phase-1 (no-signatures)
    // call; the cosigner no longer scans the chain. Currently the cosigner uses [0].
    repeated BoardingUtxo boarding_utxos = 5;
}

message SettleResponse {
    enum Status {
        SIGNING_REQUIRED = 0;
        WAITING_FOR_BATCH = 1;
        SETTLED = 2;
        ERROR = 3;
    }
    Status status = 1;
    // Sighashes that need FROST signing (when SIGNING_REQUIRED)
    repeated bytes messages_to_sign = 2;
    // Whether these sighashes are script-path spends (no taproot tweak)
    bool script_path_spend = 3;
    // Commitment txid when SETTLED
    string commitment_txid = 4;
    // Error message when ERROR
    string error_message = 5;
}

// SettleDelegate Messages

message SettleDelegateRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
    // FROST signatures for previously requested sighashes (phase 2)
    repeated bytes signed_messages = 4;
    // Phase 2 only. When true, the cosigner stores the signed intent and
    // returns DELEGATED without joining a batch. The cosigner's auto-settle
    // tick task drives the stored intent later when the threshold is reached.
    bool store_only = 5;
}

message SettleDelegateResponse {
    enum Status {
        SIGNING_REQUIRED = 0;
        SETTLED = 1;
        ERROR = 2;
        // store_only path: signed intent stored, batch not joined yet.
        DELEGATED = 3;
    }
    Status status = 1;
    // Sighashes that need FROST signing (when SIGNING_REQUIRED)
    repeated bytes messages_to_sign = 2;
    // Always true for delegate (script-path spend, no taproot tweak)
    bool script_path_spend = 3;
    // Commitment txid when SETTLED (empty for DELEGATED)
    string commitment_txid = 4;
    // Error message when ERROR
    string error_message = 5;
}

// Ark SubmitArkSend: client-built off-chain send, server proxies to ASP.

message SubmitArkSendRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
    // Base64-encoded signed Ark tx PSBT (with FROST sigs on inputs)
    string signed_ark_tx_b64 = 4;
    // Base64-encoded checkpoint PSBTs (with client FROST sigs)
    repeated string signed_checkpoint_txs_b64 = 5;
    // Outpoints of spent VTXOs ("txid:vout" format)
    repeated string spent_outpoints = 6;
}

message SubmitArkSendResponse {
    string ark_txid = 1;
    // Change VTXO info (empty if no change)
    string change_txid = 2;
    uint32 change_vout = 3;
    uint64 change_amount = 4;
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
    // The Bitcoin network this deployment operates on. One of: "mainnet",
    // "testnet", "signet", "mutinynet", "regtest". Source of truth for the
    // client's address-rendering HRP.
    string bitcoin_network = 1;
}

// Push notification registration

message RegisterDeviceTokenRequest {
    bytes user_id = 1;
    bytes signature = 2;
    int64 timestamp_ms = 3;
    string fcm_token = 4;
    string platform = 5;     // "android" | "ios"
    string app_version = 6;  // optional, for debugging
}

message RegisterDeviceTokenResponse {
    bool ok = 1;
}

// ---------------------------------------------------------------------------
// Contract creation (PEER model). NO reshare and NO new key: the wallet's existing
// 2-of-2 key V is reused; the contract is enforced by the cosigner gate (WASM
// evaluate + verifying-share allowlist). A single key-preserving REFRESH of V onto a
// {receiver, cosigner} pairing lets the chosen RECEIVER (another user, identified by
// its verifying key) co-sign V independently. Both halves of the receiver's share are
// ECIES-encrypted to receiver_vk and held in the receiver's inbox: the wallet's
// a@receiver (ecies_a_at_receiver, in this request) and the cosigner's b@receiver
// (computed + encrypted by the cosigner). Only the POINT a@receiver·G reaches the
// cosigner, so it never learns the receiver's full share.
// ---------------------------------------------------------------------------
message ContractCreateRequest {
  bytes user_id = 1;
  bytes identifier = 2;         // the wallet's V FROST identifier
  bytes contract_id = 3;        // sha256(component_wasm): the contract bound to this eVTXO
  bytes contract_wasm = 4;      // contract component bytes; cosigner verifies sha256==contract_id
  bytes server_pk = 5;          // ASP signer x-only pubkey (cooperative leaf)
  uint32 exit_delay = 6;        // unilateral-exit CSV delay (exit leaf)
  bytes owner_pk = 7;           // user-supplied unilateral-exit x-only key (exit leaf)
  bytes receiver_vk = 8;        // the peer RECEIVER's verifying key (33B)
  bytes a_at_cosigner = 9;      // wallet's refresh slice of V to the cosigner (scalar, 32B)
  bytes a_at_receiver_point = 10; // wallet's refresh slice of V to the receiver, as POINT (33B)
  bytes signature = 11;         // Schnorr auth signature
  int64 timestamp_ms = 12;      // replay protection
  bytes ecies_a_at_receiver = 13; // ECIES(a@receiver) to receiver_vk — the wallet's encrypted half
  // Phase 2 (template + variable composition). When `template_id` is set, the cosigner composes a
  // CONTRACT from a published TEMPLATE + the author's typed config: it fetches the template + its
  // provider STUB (both by content id), patches `config_blob` (the encoded key-value config) into
  // the stub, composes them into one component, and the COMPOSED sha256 becomes the bound
  // contract_id (committing the variables). When empty, `contract_id`/`contract_wasm` above are used.
  string template_id = 14;      // content id (hex) of the registered template
  string stub_id = 15;          // content id (hex) of the template's provider stub
  bytes config_blob = 16;       // encoded KV config the cosigner patches into the stub
}

message ContractCreateResponse {
  bytes contract_script_pubkey = 1; // registered eVTXO scriptPubKey (cooperative leaf = V)
  bytes contract_id = 2;            // the bound contract id (composed sha256 in template mode)
}

// ---------------------------------------------------------------------------
// Inbox pickup (PEER model). The receiver fetches the contract-share halves held for
// it in its own inbox, decrypts BOTH ECIES halves with its signing secret, sums them
// into its share P = a@receiver + b@receiver, then acks to clear. No FCM/poll loop is
// required — the inbox is surfaced on the receiver's authenticated pull.
// ---------------------------------------------------------------------------
message EvtxoPendingSharesRequest {
  bytes user_id = 1;       // the receiver (its own actor)
  bytes signature = 2;
  int64 timestamp_ms = 3;
}
message EvtxoPendingSharesResponse {
  repeated PendingContractShare shares = 1;
}
message PendingContractShare {
  bytes evtxo_script_pubkey = 1;        // the contract eVTXO (also the pairing actor to address at spend)
  bytes contract_id = 2;                // sha256(wasm)
  bytes ecies_half_author = 3;          // ECIES(a@receiver) — the wallet/author's half
  bytes ecies_half_cosigner = 4;        // ECIES(b@receiver) — the cosigner's half
  string public_key_package_json = 5;   // the 2-entry pairing PKP {receiver_id, cosigner_id}
  uint32 exit_delay = 6;
  bytes server_pk = 7;                  // ASP signer x-only (cooperative leaf)
  bytes owner_pk = 8;                   // exit-leaf owner x-only (for the taptree)
}
message EvtxoAckShareRequest {
  bytes user_id = 1;                    // the receiver
  bytes evtxo_script_pubkey = 2;        // the share to clear from the inbox
  bytes signature = 3;
  int64 timestamp_ms = 4;
}
message EvtxoAckShareResponse {
  bool ok = 1;
}

// ---------------------------------------------------------------------------
// Request-to-pay
// ---------------------------------------------------------------------------

// A party this wallet has authorized to send it payment requests. One-way: the owner decides who
// may bill it; the contact needs no consent and is not notified.
message Contact {
  bytes verifying_key = 1;   // the contact's group verifying key (33-byte compressed)
  string label = 2;          // local display name, chosen by the owner
  int64 added_at = 3;        // unix seconds
}

message ContactAddRequest {
  bytes user_id = 1;                 // the owner (its own actor)
  bytes contact_verifying_key = 2;
  string label = 3;
  bytes signature = 4;
  int64 timestamp_ms = 5;
}
message ContactAddResponse {
  bool ok = 1;
}

message ContactRemoveRequest {
  bytes user_id = 1;                 // the owner
  bytes contact_verifying_key = 2;
  bytes signature = 3;
  int64 timestamp_ms = 4;
}
message ContactRemoveResponse {
  bool ok = 1;
}

message ContactListRequest {
  bytes user_id = 1;                 // the owner
  bytes signature = 2;
  int64 timestamp_ms = 3;
}
message ContactListResponse {
  repeated Contact contacts = 1;
}

// A request-to-pay held for the payer. NOT a pre-signed transaction: FROST is 2-round interactive
// and Ark checkpoints need an ASP counter-signature, so no payment can be fully signed ahead of the
// payer's approval. This records WHO asked, HOW MUCH, TO WHICH ADDRESS and UNTIL WHEN; the payer
// reviews it and either signs the payment or declines.
message PaymentIntent {
  string id = 1;
  bytes from_verifying_key = 2;      // the requester (was on the payer's allowlist at create time)
  string to_ark_address = 3;         // DERIVED by the cosigner from from_verifying_key
  uint64 amount_sats = 4;
  string memo = 5;
  int64 created_at = 6;
  int64 expires_at = 7;
  string status = 8;                 // pending | fulfilled | declined | expired
  string ark_txid = 9;               // set when fulfilled
}

// Sent by the REQUESTER but routed to the PAYER's actor: `user_id` is the requester (who signs),
// while the URL/actor id is the payer. The payer's allowlist is the only authorization.
message PaymentRequestCreateRequest {
  bytes user_id = 1;                 // the REQUESTER (signer) — not the payer
  uint64 amount_sats = 2;
  string memo = 3;
  int64 expires_in_secs = 4;         // 0 ⇒ cosigner default
  bytes signature = 5;
  int64 timestamp_ms = 6;
}
message PaymentRequestCreateResponse {
  PaymentIntent intent = 1;
}

message PaymentRequestListRequest {
  bytes user_id = 1;                 // the payer (its own actor)
  bytes signature = 2;
  int64 timestamp_ms = 3;
}
message PaymentRequestListResponse {
  repeated PaymentIntent intents = 1;
}

message PaymentRequestDeclineRequest {
  bytes user_id = 1;                 // the payer
  string id = 2;
  bytes signature = 3;
  int64 timestamp_ms = 4;
}
message PaymentRequestDeclineResponse {
  bool ok = 1;
}
