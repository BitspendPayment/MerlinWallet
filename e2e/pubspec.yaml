name: e2e
description: End-to-End tests for MPC Wallet
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  app_core:
    path: ../app-core
  protocol:
    path: ../protocol
  grpc: ^3.2.4
  protobuf: ^3.1.0
  http: ^1.2.0
  bitcoin_base: ^7.0.0
  blockchain_utils: ^5.4.0
  hive: ^2.2.3
  args: ^2.4.0
  # Ed25519 signing to mint session tokens for the gated-wallet e2e (matches the cosigner's key).
  cryptography: ^2.7.0
  crypto: ^3.0.5

dev_dependencies:
  test: ^1.24.0
